# macOS

font_size 14

# Option funciona como Alt (atajos de fish como alt+←/→, alt+e)
macos_option_as_alt yes

# Prefijos por defecto de Homebrew (Apple Silicon / Intel). Una app abierta desde
# el Dock no hereda el PATH de la terminal.
exe_search_path +/opt/homebrew/bin
exe_search_path +/usr/local/bin

# Keybindings: mismos atajos que en Linux, con cmd en lugar de ctrl
# Window management (New OS Window)
map cmd+n       launch --type=os-window --cwd=~
map cmd+shift+n launch --type=os-window --cwd=current

# Tab management
map cmd+t       launch --type=tab --cwd=~
map cmd+shift+t launch --type=tab --cwd=current
map cmd+w       close_tab
