# Shell
shell /usr/bin/fish

# Font Configuration (FiraCode Nerd Font with ligatures)
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures never

# Window & Appearance
window_padding_width 12
background_opacity   0.92
confirm_os_window_close 0
enable_audio_bell no

# Cursor & Performance
cursor_shape beam
cursor_beam_thickness 1.5
repaint_delay 8
input_delay 2
sync_to_monitor yes

# Tab Bar Style
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# Tokyo Night Color Scheme
background #1a1b26
foreground #c0caf5
selection_background #33467c
selection_foreground #c0caf5
url_color #73daca
cursor #c0caf5
cursor_text_color #1a1b26

# Tabs
active_tab_background #7aa2f7
active_tab_foreground #16161e
inactive_tab_background #292e42
inactive_tab_foreground #545c7e

# Windows Border
active_border_color #7aa2f7
inactive_border_color #292e42

# Normal colors
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6

# Bright colors
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Extended colors
color16 #ff9e64
color17 #db4b4b

# Keybindings
# Window management (New OS Window)
map ctrl+n new_os_window
map ctrl+shift+n new_os_window_with_cwd

# Tab management
map ctrl+t new_tab
map ctrl+shift+t new_tab_with_cwd
map ctrl+w close_tab
