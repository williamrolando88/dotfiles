# Linux

font_size 11.5

# Backend de visualización y entrada
# NOTA / LIMITACIÓN: Configuración pensada específicamente para Bazzite Linux (GNOME Shell / Mutter en Wayland).
# En un arranque en frío en Bazzite GNOME con GPU híbrida, el backend nativo de Wayland sufre una condición
# de carrera con wl_seat/Mutter que bloquea la entrada del teclado durante ~20-50s al abrir Kitty como primer programa.
# Forzar x11 (XWayland) entrega los eventos vía X11 y elimina el bloqueo de inmediato.
# En otros sistemas Linux (KDE Plasma, Hyprland, Sway u otras distros sin este bug en Mutter) esto no suele ser
# necesario y puede cambiarse a 'linux_display_server auto' o comentarse.
linux_display_server x11
wayland_enable_ime no

# Prefijos por defecto de Linuxbrew, por si fish no está en el PATH del sistema
exe_search_path +/home/linuxbrew/.linuxbrew/bin
exe_search_path +~/.linuxbrew/bin

# Keybindings
# Window management (New OS Window)
map ctrl+n       launch --type=os-window --cwd=~
map ctrl+shift+n launch --type=os-window --cwd=current

# Tab management
map ctrl+t       launch --type=tab --cwd=~
map ctrl+shift+t launch --type=tab --cwd=current
map ctrl+w       close_tab
